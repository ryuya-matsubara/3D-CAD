<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#182b24" />
    <meta name="referrer" content="no-referrer" />
    <title>3D CAD | 3Dワークスペース</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brandmark" aria-hidden="true">⬡</span>3D <b>CAD</b>
      </div>
      <div class="headActions">
        <button id="share">編集リンクを共有</button
        ><button id="export" class="primary">書き出し</button>
      </div>
    </header>
    <main>
      <section class="heading">
        <div>
          <div class="eyebrow">MODEL WORKSPACE</div>
          <h1>
            <button id="rename" title="モデル名を変更">フランジプレート</button>
          </h1>
        </div>
        <div id="status" role="status">起動中</div>
      </section>
      <div class="workspace">
        <section class="stage">
          <div class="stageHead">
            <strong><span class="greenSquare"></span>3Dビュー</strong
            ><span class="unit">単位　mm</span>
          </div>
          <div id="viewport" aria-label="3Dモデルのプレビュー">
            <div class="viewControls">
              <button id="measure" aria-pressed="false">寸法</button><button id="pin" aria-pressed="false">ビューを固定</button>
            </div>
            <canvas id="axis" width="160" height="160" aria-label="XYZ座標軸"></canvas><canvas id="dimension-lines" aria-label="選択形状の寸法線"></canvas><div class="zoom">
              <button id="zoomOut" aria-label="縮小">−</button
              ><button id="fit">全体表示</button
              ><button id="zoomIn" aria-label="拡大">＋</button>
            </div>
            <div id="empty" hidden>形状を追加してください</div>
          </div>
          <div class="metrics">
            <div><small>外形寸法</small><strong id="size">—</strong></div>
          </div>
        </section>
        <aside>
          <div class="panelTitle">
            <h2>モデル編集</h2>
            <div class="history">
              <button id="undo" aria-label="元に戻す" title="元に戻す">↶</button
              ><button id="redo" aria-label="やり直す" title="やり直す">
                ↷
              </button>
            </div>
          </div>
          <div class="palette">
            <button data-add="box">＋ プレート</button
            ><button data-add="cylinder">＋ 円柱</button
            ><button data-add="hole">＋ 貫通穴</button>
          </div>
          <div class="treeTitle">
            <h3>形状ツリー</h3>
            <span id="count"></span>
          </div>
          <div id="tree" role="group" aria-label="編集する形状"></div>
          <form id="inspector" hidden>
            <div class="treeTitle">
              <h3>パラメーター</h3>
              <button type="button" id="remove">削除</button>
            </div>
            <label class="nameLabel"
              >形状名<input id="featureName" maxlength="64" required
            /></label>
            <div id="fields"></div>
            <button type="submit" class="apply">変更を適用</button>
          </form>
        </aside>
      </div>
      <footer>
        <span>3D CAD</span><button id="saveModel">モデルを保存</button><button id="openModel">モデルを開く</button><input id="modelFile" type="file" accept=".json" hidden><button id="newModel">新規モデル</button>
      </footer>
      <div id="notice" role="status" hidden></div>
    </main>
    <dialog id="modal">
      <form method="dialog" class="dialogHead">
        <h2 id="dialogTitle"></h2>
        <button aria-label="閉じる">×</button>
      </form>
      <div id="dialogBody"></div>
    </dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
